<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Calculator</h1>
      <span class="total">1203103132</span>
      <div class="layer">
        <button>7</button>
        <button>8</button>
        <button>9</button>
      </div>
      <div class="layer">
        <button>4</button>
        <button>5</button>
        <button>6</button>
      </div>
      <div class="layer">
        <button>1</button>
        <button>2</button>
        <button>3</button>
      </div>
      <div class="operators">
        <button class="opera">+</button>
        <button class="opera">-</button>
        <button class="opera">*</button>
        <button class="opera">/</button>
      </div>
      <div class="enter">
        <button>=</button>
        <button>CLR</button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
