<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Calculator</h1>
      <span>1203103132</span>
      <div class="seven-nine">
        <button>7</button>
        <button>8</button>
        <button>9</button>
      </div>
      <div class="four-six">
        <button>4</button>
        <button>5</button>
        <button>6</button>
      </div>
      <div class="one-three">
        <button>1</button>
        <button>2</button>
        <button>3</button>
      </div>
      <div class="operators">
        <button>+</button>
        <button>-</button>
        <button>*</button>
        <button>/</button>
      </div>
      <div class="enter">
        <button>=</button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
