<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Calculator</h1>
      <span>1203103132</span>
      <div class="seven-nine">
        <span>7</span>
        <span>8</span>
        <span>9</span>
      </div>
      <div class="four-six">
        <span>4</span>
        <span>5</span>
        <span>6</span>
      </div>
      <div class="one-three">
        <span>1</span>
        <span>2</span>
        <span>3</span>
      </div>
      <div class="operators">
        <span>+</span>
        <span>-</span>
        <span>*</span>
        <span>/</span>
      </div>
      <div class="enter">
        <span>=</span>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
